# Fails the run when a commit adds a secret (API key, token, password,
# connection string). Uses the open-source gitleaks CLI: GitHub's own secret
# scanning needs the paid Secret Protection add-on on private repositories.
#
# A push or pull request is checked on its new commits only, so the secrets
# already in the history (rotated on 23.10.2026) do not fail every run. A
# manual run checks the files as they are now.

name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..HEAD" --redact --no-banner .
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            "$RUNNER_TEMP/gitleaks" git --log-opts="$BEFORE..HEAD" --redact --no-banner .
          else
            "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
          fi
